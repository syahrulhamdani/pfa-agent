services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pfa
      POSTGRES_PASSWORD: pfa
      POSTGRES_DB: pfa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfa -d pfa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
